# Phase 7: docker 프로파일 공통 오버라이드 — localhost → compose 서비스명 DNS.
# SPRING_PROFILES_ACTIVE=docker 인 컨테이너에만 적용된다.
# (Config Server가 GET /{app}/docker 요청 시 application-docker.yml·{app}-docker.yml 을 자동 병합.)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:9000/oauth2/jwks   # localhost:9000 → 서비스명
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/       # localhost:8761 → 서비스명
  instance:
    prefer-ip-address: true   # 컨테이너 IP로 등록(다른 컨테이너가 라우팅 가능한 주소) — localhost 등록 회피
