# order-query-service 전용 중앙 설정 (Phase 11: CQRS 읽기 모델).
# 저장소가 MongoDB라 datasource(JDBC)·Flyway가 없다 — 문서형은 스키마 마이그레이션 대신 투영으로 모양을 만든다.
# 비밀번호는 {cipher} 암호문(Config Server가 ENCRYPT_KEY로 복호화). 공통값은 application.yml.
spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: orderquerydb
      username: orderquery
      # 평문 = orderquerypw (dev). 운영이면 Vault 등 외부 보관소 — Phase 15.
      password: '{cipher}5c12e254a61a800f331439f0e4b18e862e4fbd5b2351fad62cb60b514e6ca9e8'
      # mongo 이미지의 루트 사용자는 admin DB에 생성된다 → 인증은 admin 에서 수행.
      authentication-database: admin
      # Spring Data MongoDB 3.0+ 는 @Indexed 자동 인덱스 생성을 기본 OFF 로 둔다
      # (운영에서 앱 기동이 몰래 인덱스를 만드는 걸 막기 위함). 학습용이라 명시적으로 켠다 —
      # 켜지 않으면 @Indexed 가 아무 일도 하지 않아 고객별 조회가 컬렉션 풀스캔이 된다.
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
