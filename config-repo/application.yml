# 모든 config 클라이언트 공통 기본값 (Phase 6 중앙 설정).
# 특정 서비스 파일({service}.yml)이 같은 키를 정의하면 그쪽이 우선한다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway 소유, Hibernate는 검증만
    open-in-view: false
    properties:
      hibernate.format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks   # auth-service JWKS(공개키) — 직접 host:port
  # ── Phase 9: Kafka (order 발행 / inventory 소비). spring-kafka 없는 서비스는 이 설정을 무시. ──
  kafka:
    bootstrap-servers: localhost:9092    # 호스트 리스너(PLAINTEXT_HOST). docker 프로파일이 kafka:19092로 오버라이드.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000               # 브로커 부재 시(기본 프로파일) send가 5초만 대기하고 실패 → 주문은 계속 진행
    consumer:
      auto-offset-reset: earliest        # 그룹 최초 조인 시 처음부터 소비(리플레이 학습)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.shopsaga.events"   # 공유 이벤트 계약 패키지만 역직렬화 신뢰
    template:
      observation-enabled: true          # KafkaTemplate → traceparent 헤더 주입(HTTP→Kafka 트레이스 연결)
    listener:
      observation-enabled: true          # @KafkaListener → traceparent 추출·자식 스팬

# ── Phase 10: Outbox 릴레이 폴링 주기(order-service의 OutboxRelay만 사용; 릴레이 없는 서비스는 무시). ──
outbox:
  relay:
    fixed-delay: 1000                    # ms. 미발행 outbox row를 Kafka로 내보내는 폴링 간격.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # Map 키 → camelCase 필수
  instance:
    hostname: localhost

management:
  endpoint:
    health:
      show-details: always
  # ── Phase 8: 관측성(트레이싱·메트릭) — OTLP로 grafana/otel-lgtm(:4318)에 push ──
  tracing:
    sampling:
      probability: 1.0            # 학습용 전량 샘플링(운영은 0.1~0.3). 기본 0.1이면 대부분 요청이 트레이스 안 됨.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # Phase 8b: p95 지연 히스토그램 버킷 생성(대시보드 histogram_quantile용).
  otlp:
    logging:
      endpoint: http://localhost:4318/v1/logs      # Phase 8b: 로그 OTLP→Loki. 이 키가 OtlpLogging 자동구성 트리거.
    tracing:
      endpoint: http://localhost:4318/v1/traces   # OTLP/HTTP. 기본값 없음 → 반드시 명시(미명시 시 익스포터 미구성).
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s                 # push 주기(기본 60s) — 데모에서 빨리 보이게. docker 프로파일이 endpoint를 서비스명으로 오버라이드.
