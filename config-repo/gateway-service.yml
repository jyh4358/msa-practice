# gateway-service 전용 중앙 설정 (라우트 + actuator). 공통값은 application.yml 참조.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: orders-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: inventory-route
              uri: lb://order-service
              predicates:
                - Path=/inventory/**
            - id: payments-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
