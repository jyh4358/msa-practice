# gateway-service 전용 중앙 설정 (라우트 + actuator). 공통값은 application.yml 참조.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            # ── Phase 14: 라우트마다 CircuitBreaker 필터 + fallbackUri.
            #    회로가 열리거나 TimeLimiter(3s)를 넘기면 다운스트림을 때리지 않고 즉시 forward → 503.
            #    ⚠️ 회로 이름을 라우트별로 다르게 둔다 — 하나로 묶으면 order 장애가 inventory 회로까지 연다.
            - id: orders-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: ordersCb
                    fallbackUri: forward:/fallback/order-service
            - id: inventory-route
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCb
                    fallbackUri: forward:/fallback/inventory-service
            - id: payments-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentsCb
                    fallbackUri: forward:/fallback/payment-service
            # Phase 11: CQRS 읽기 측 — 조회는 읽기 모델 서비스로(쓰기 /orders 와 다른 서비스로 분리 라우팅).
            - id: order-views-route
              uri: lb://order-query-service
              predicates:
                - Path=/order-views/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderViewsCb
                    fallbackUri: forward:/fallback/order-query-service
  # Phase 8: WebFlux 리액터 컨텍스트 자동 전파 — 트레이스 컨텍스트가 리액티브 파이프라인/다운스트림(lb://)으로 이어지게.
  reactor:
    context-propagation: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,metrics
  endpoint:
    gateway:
      access: read-only
  health:
    circuitbreakers:
      enabled: true          # Phase 14: /actuator/health 에 회로 상태(CLOSED/OPEN/HALF_OPEN) 노출

# ── Phase 14: 엣지(게이트웨이) 과부하 차단. 학습용으로 일부러 낮게 잡았다. ──
gateway:
  resilience:
    protected-path-prefix: /orders
    rate-limit-per-second: 20
    max-concurrent-calls: 20
