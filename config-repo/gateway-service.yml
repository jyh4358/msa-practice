# gateway-service 전용 중앙 설정 (라우트 + actuator). 공통값은 application.yml 참조.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: orders-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: inventory-route
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
            - id: payments-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
  # Phase 8: WebFlux 리액터 컨텍스트 자동 전파 — 트레이스 컨텍스트가 리액티브 파이프라인/다운스트림(lb://)으로 이어지게.
  reactor:
    context-propagation: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
