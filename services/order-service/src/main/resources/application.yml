spring:
  application:
    name: order-service        # {application} 키 — 반드시 로컬(서버가 이 이름으로 설정을 찾음)
  config:
    # config-first: 직접 URL. optional: → config-service 없어도 로컬 기본값으로 컨텍스트는 부팅(dev).
    # (datasource·jpa·flyway·security·payment url·eureka·health 상세는 config-service에서 온다.)
    import: "optional:configserver:http://localhost:8888"

server:
  port: 8080                   # 포트는 로컬 유지(서버 다운 시 전부 8080 충돌 방지)
  shutdown: graceful
