spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: order
    password: orderpw
  jpa:
    hibernate:
      # 스키마는 Flyway가 소유한다. Hibernate는 검증만(불일치 시 부팅 실패 → 빠른 피드백).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    # 기본 위치: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks   # auth-service JWKS (직접 host:port)

payment:
  service:
    # Phase 4: 하드코딩 host:port → 서비스 이름. @LoadBalanced RestClient 가 Eureka로 실제 인스턴스를 해석.
    url: http://payment-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # 맵 키 defaultZone 은 camelCase 필수
  instance:
    hostname: localhost   # 단일 머신 dev: lb 해석이 localhost:port 로 가도록 (Phase 7 compose에서 재검토)

server:
  port: 8080
  shutdown: graceful   # 진행 중 요청을 끝내고 종료 (계획 cross-cutting 규칙)

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
