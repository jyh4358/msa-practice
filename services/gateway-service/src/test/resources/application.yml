# 게이트웨이 테스트 전용 설정 — config-service 없이 자립 실행.
# Phase 6에서 라우트가 중앙 config로 이동했으므로, 테스트에는 로컬 복사본을 둔다.
# (spring.config.import 를 두지 않아 테스트가 config-service 를 찾지 않는다.)
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  cloud:
    config:
      enabled: false        # 테스트는 config-service 없이 자립 — config 클라이언트 비활성화(import 불필요)
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: orders-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            - id: inventory-route
              uri: lb://order-service
              predicates:
                - Path=/inventory/**
            - id: payments-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

eureka:
  client:
    enabled: false
