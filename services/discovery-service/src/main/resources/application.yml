spring:
  application:
    name: discovery-service

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # 이 서버 자신은 레지스트리에 등록하지 않고(register-with-eureka),
    # 레지스트리를 가져오지도 않는다(fetch-registry) — 단독(standalone) 레지스트리 모드.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      # 주의: defaultZone 은 Map<String,String> 키라 relaxed-binding 이 적용되지 않음 → 반드시 camelCase.
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
