# Phase 7: 전체 스택 로컬 오케스트레이션 — 2 DB + 6 서비스를 한 번에.
#
#   ./gradlew bootJar                                        # 먼저 각 서비스 jar 빌드
#   cp deploy/compose/.env.example deploy/compose/.env       # ENCRYPT_KEY 준비
#   docker compose -f deploy/compose/compose.yml up --build  # 이미지 빌드 + 기동
#
# 로컬(호스트) ./gradlew bootRun 워크플로와 공존한다(프로파일 default vs docker). 단 포트가 겹치므로 동시 실행 X.
name: shopsaga

networks:
  shopsaga-net:
    driver: bridge

volumes:
  order-db-data:
  payment-db-data:
  inventory-db-data:     # Phase 9 (--profile async)
  order-query-mongo-data:  # Phase 11 읽기 모델 (--profile async)

# 4개 앱 클라이언트(auth/order/payment/gateway) 공통 설정 (YAML 앵커).
x-app-common: &app-common
  networks: [shopsaga-net]
  restart: unless-stopped
  environment: &app-env
    SPRING_PROFILES_ACTIVE: docker
    # 부트스트랩 값(Config Server 자신을 가리킴)이라 중앙 config가 아닌 env로 주입.
    SPRING_CONFIG_IMPORT: "configserver:http://config-service:8888"
    JAVA_OPTS: "-Xms128m -Xmx320m"
  deploy:
    resources:
      limits:
        memory: 512M

services:
  # ── 인프라 DB (내부 전용, 호스트 포트 미공개) ──
  order-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: orderpw
    volumes:
      - order-db-data:/var/lib/postgresql   # PG18: /var/lib/postgresql 에 마운트
    networks: [shopsaga-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  payment-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: paymentpw
    volumes:
      - payment-db-data:/var/lib/postgresql
    networks: [shopsaga-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── 비동기 인프라 (Phase 9: --profile async 로만 기동) ──
  inventory-db:
    image: postgres:18-alpine
    profiles: [async]
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventorypw
    volumes:
      - inventory-db-data:/var/lib/postgresql
    networks: [shopsaga-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorydb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  # Phase 11: CQRS 읽기 모델 저장소(문서형). 쓰기 DB(orderdb)와 완전히 분리 — 읽기/쓰기 독립.
  order-query-mongo:
    image: mongo:8
    profiles: [async]
    restart: unless-stopped
    environment:
      # 루트 사용자는 항상 admin DB에 생성된다 → 클라이언트는 authentication-database=admin 필요.
      MONGO_INITDB_ROOT_USERNAME: orderquery
      MONGO_INITDB_ROOT_PASSWORD: orderquerypw
      MONGO_INITDB_DATABASE: orderquerydb
    ports:
      - "27017:27017"     # 호스트 접근(로컬 개발/투영 확인용 mongosh)
    volumes:
      - order-query-mongo-data:/data/db     # mongo 데이터 경로는 /data/db
    networks: [shopsaga-net]
    healthcheck:
      # mongo:6+ 는 레거시 `mongo` 셸이 제거됨 → 반드시 `mongosh` 사용.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: apache/kafka:4.3.1          # KRaft(ZooKeeper 없음), arm64 네이티브
    profiles: [async]
    hostname: kafka                     # 컨테이너 DNS 이름 = advertised listener 와 일치
    restart: unless-stopped
    networks: [shopsaga-net]
    ports:
      - "9092:9092"                     # 호스트 접근(PLAINTEXT_HOST) — 로컬 개발/디버깅용
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 3분리: CONTROLLER(KRaft) · PLAINTEXT(컨테이너간 kafka:19092) · PLAINTEXT_HOST(호스트 localhost:9092)
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # 단일 노드 — 내부 토픽 replication-factor 를 1로(기본 3이면 생성 실패).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1   # Kafka 4.x
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 토픽은 KafkaAdmin+NewTopic 으로 명시 생성
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms200m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 700M

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest   # provectuslabs 는 미유지 → kafbat 공식 포크
    profiles: [async]
    restart: unless-stopped
    networks: [shopsaga-net]
    ports:
      - "8090:8080"                     # 토픽/메시지 관찰 UI
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsaga-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M

  # ── 관측성 백엔드 (Phase 8: grafana/otel-lgtm 올인원 — Tempo·Loki·Prometheus·Grafana + OTLP 수신) ──
  otel-lgtm:
    image: grafana/otel-lgtm:0.29.1      # 버전 고정(재현성). 개발/데모 전용 올인원(프로덕션 아님).
    restart: unless-stopped
    networks: [shopsaga-net]
    ports:
      - "3000:3000"        # Grafana UI — 트레이스/메트릭 탐색
      - "4317:4317"        # OTLP gRPC 수신
      - "4318:4318"        # OTLP HTTP 수신 — 앱이 여기로 트레이스/메트릭 전송
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"    # 익명 접근(개발 편의) — 로그인 없이 Grafana 열람
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      # Phase 8b: 커스텀 RED 대시보드 프로비저닝(내장 RED/JVM 대시보드와 공존 — 별도 provider yaml + 폴더).
      - ../grafana/provisioning/shopsaga-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/shopsaga-dashboards.yaml:ro
      - ../grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/shopsaga:ro
    healthcheck:
      test: ["CMD-SHELL", "cat /tmp/ready || exit 1"]   # otel-lgtm은 HTTP가 아닌 파일 기반 준비 신호
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Config Server (먼저 떠야 함) ──
  config-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/config-service/build/libs/config-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/config-service:latest
    restart: unless-stopped
    networks: [shopsaga-net]
    ports:
      - "8888:8888"        # 설정 확인용 공개
    environment:
      ENCRYPT_KEY: "${ENCRYPT_KEY:?ENCRYPT_KEY 필요 (deploy/compose/.env 참고)}"
      # native 검색 경로를 마운트된 컨테이너 경로로 오버라이드(로컬은 절대 호스트 경로).
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config-repo"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_ADD_LABEL_LOCATIONS: "false"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - ../../config-repo:/config-repo:ro   # config-repo 를 읽기전용 마운트
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  # ── Eureka (config 클라이언트 아님, 독립) ──
  discovery-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/discovery-service/build/libs/discovery-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/discovery-service:latest
    restart: unless-stopped
    networks: [shopsaga-net]
    ports:
      - "8761:8761"        # Eureka 대시보드 공개
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  # ── 앱 서비스 (config·discovery healthy 이후) ──
  auth-service:
    <<: *app-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/auth-service/build/libs/auth-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/auth-service:latest
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  order-service:
    <<: *app-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/order-service/build/libs/order-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/order-service:latest
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      order-db: { condition: service_healthy }
      # Phase 12: order 가 order-events 토픽을 선언·발행한다(auto-create 꺼짐) → 브로커가 먼저 떠야 한다.
      # required:false = async 프로파일이 아닐 때는 kafka 없이도 기동(그때는 Saga가 진행되지 않는다).
      kafka: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  payment-service:
    <<: *app-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/payment-service/build/libs/payment-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/payment-service:latest
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      payment-db: { condition: service_healthy }
      # Phase 12: payment 가 payment-events 토픽을 선언·발행하고 inventory-events 를 소비한다.
      kafka: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Phase 9: 재고 소유 서비스(--profile async). OrderPlaced 소비 → 재고 예약.
  inventory-service:
    <<: *app-common
    profiles: [async]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/inventory-service/build/libs/inventory-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/inventory-service:latest
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      inventory-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Phase 11: CQRS 읽기 측(--profile async). OrderPlaced 소비 → Mongo 읽기 모델 투영 + 조회 API.
  order-query-service:
    <<: *app-common
    profiles: [async]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/order-query-service/build/libs/order-query-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/order-query-service:latest
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      order-query-mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  gateway-service:
    <<: *app-common
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.service
      args:
        JAR_FILE: services/gateway-service/build/libs/gateway-service-0.0.1-SNAPSHOT.jar
    image: shopsaga/gateway-service:latest
    ports:
      - "8000:8000"        # 단일 진입점만 공개
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
