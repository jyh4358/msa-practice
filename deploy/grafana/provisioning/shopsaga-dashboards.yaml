# Phase 8b: 커스텀 대시보드 provider. otel-lgtm 내장 grafana-dashboards.yaml(RED/JVM)과 공존한다.
# 이 파일은 컨테이너의 .../provisioning/dashboards/ 로 마운트되고, path 는 별도 폴더를 가리켜 충돌하지 않는다.
apiVersion: 1
providers:
  - name: "ShopSaga"
    type: file
    orgId: 1
    folder: "ShopSaga"
    disableDeletion: false
    allowUiUpdates: true          # 개발 중 UI 편집 허용
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/grafana/conf/provisioning/dashboards/shopsaga
      foldersFromFilesStructure: false
