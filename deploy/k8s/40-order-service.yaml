# Phase 16a — order-service: 이번 Phase 의 주인공.
#
# **같은 이미지**를 그대로 k8s 로 옮긴다(재작성 아님). 코드에서 바뀐 건 딱 하나 —
# 보안 설정에서 probe 하위 경로(`/actuator/health/**`)를 열어준 것뿐이다.
# 나머지는 전부 "compose 의 무엇이 k8s 의 무엇으로 바뀌는가"의 문제다:
#
#   compose environment / Config Server  →  ConfigMap (+ 파일 마운트)
#   compose 의 {cipher} 비밀번호          →  Secret → 환경변수
#   compose depends_on: condition        →  readinessProbe (더 정확하다: 기동뿐 아니라 '지금' 준비됐는지)
#   compose restart: unless-stopped      →  livenessProbe + Deployment 의 파드 재생성
#   compose ports: "8080:8080"           →  Service(type: NodePort)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: shopsaga
data:
  application.yml: |
    # ── Phase 16a: Config Server(Phase 6)를 대체하는 ConfigMap ──
    # config-repo/{application.yml + order-service.yml + *-docker.yml} 이 하던 병합을
    # 여기서는 사람이 직접 한 벌로 합쳐 둔다.
    #   장점: 클러스터가 곧 진실. 서비스가 남의 서비스(Config Server)에 기동 의존하지 않는다.
    #   단점: 공통값 상속이 없다 → 서비스마다 같은 줄을 반복한다(16b 에서 공통 ConfigMap 분리로 완화).
    spring:
      datasource:
        # ★ Eureka 도 Config Server 도 없이 상대를 찾는다 — k8s Service DNS.
        #   `order-db` 는 같은 네임스페이스의 Service 이름이고, CoreDNS 가 ClusterIP 로 풀어준다.
        url: jdbc:postgresql://order-db:5432/orderdb
        # username/password 는 여기에 쓰지 않는다 → Secret 에서 환경변수로 주입(아래 Deployment 참고).
        # 환경변수가 설정 파일보다 우선순위가 높으므로 SPRING_DATASOURCE_PASSWORD 가 이긴다.
      jpa:
        hibernate:
          ddl-auto: validate          # 스키마 소유자는 Flyway
        open-in-view: false
      flyway:
        enabled: true
      security:
        oauth2:
          resourceserver:
            jwt:
              jwk-set-uri: http://auth-service:9000/oauth2/jwks   # ★ 역시 Service DNS
      cloud:
        bus:
          enabled: false              # 16a 엔 Kafka 가 없다(Phase 15 의 설정 방송은 16b 에서 복구)
      kafka:
        listener:
          auto-startup: false         # 브로커 부재 시 리스너가 100ms 마다 재연결 로그를 쏟는 것을 막는다
        producer:
          properties:
            max.block.ms: 2000        # outbox 릴레이가 브로커를 못 찾을 때 빨리 포기(기본 60s)

    eureka:
      client:
        enabled: false                # 16b 에서 Eureka 자체를 삭제한다

    # ── outbox: 브로커가 없어도 '주문 접수'는 성공해야 한다 ──
    # Phase 10 에서 만든 성질이 여기서 그대로 증명된다. 주문 저장과 이벤트 적재가 한 트랜잭션이므로
    # Kafka 가 없어도 POST /orders 는 201 을 돌려주고, 이벤트는 outbox 에 남아 있다가 16b 에서 흘러간다.
    outbox:
      relay:
        fixed-delay: 5000             # 16a 엔 브로커가 없으니 폴링을 늦춰 로그 소음을 줄인다(16b 에서 1000 복구)
        max-attempts: 5

    saga:
      mode: orchestration

    order:
      stock-precheck:
        enabled: false                # 16a 엔 inventory-service 가 없다(16b 에서 복구)

    messaging:
      dlq:
        enabled: false                # 브로커가 없으므로 DLT 토픽 생성 시도를 하지 않는다

    # 어느 파드가 응답했는지 눈으로 확인하기 위한 장치(스케일·자가치유 실증용).
    # POD_NAME 은 Deployment 에서 Downward API 로 주입한다 — 파드가 자기 메타데이터를 환경변수로 읽는 방법.
    info:
      pod: ${POD_NAME:unknown}
      node: ${NODE_NAME:unknown}

    management:
      info:
        env:
          enabled: true             # info.* 프로퍼티를 /actuator/info 에 노출(기본 false)
      endpoints:
        web:
          exposure:
            include: health,info,flyway,metrics
      endpoint:
        health:
          # ★★ Phase 16 의 핵심 설정 — 이게 없으면 liveness/readiness 엔드포인트 자체가 없다.
          probes:
            enabled: true
          show-details: always
          # ── liveness 와 readiness 를 '무엇으로' 판단할지 ──
          # 기본값은 둘 다 애플리케이션 상태(ApplicationAvailability)만 본다. 의존성은 포함되지 않는다.
          group:
            readiness:
              # readiness = "지금 트래픽을 받아도 되는가". DB 가 끊기면 요청을 받아봐야 실패하므로 포함한다.
              # 실패하면 k8s 가 이 파드를 Service Endpoints 에서 **빼기만** 한다(죽이지 않는다).
              include: readinessState,db
            liveness:
              # liveness = "이 프로세스를 죽이고 다시 살리면 나아지는가".
              # ⚠️ 여기에 db 를 넣으면 안 된다. DB 장애 때 모든 파드가 동시에 재시작 루프에 빠지고
              #    (재시작해도 DB 는 안 고쳐진다) 복구 순간 커넥션 폭풍이 DB 를 다시 죽인다.
              include: livenessState
      health:
        circuitbreakers:
          enabled: false              # 16a 엔 사전 확인 호출이 꺼져 있어 회로가 없다
      tracing:
        enabled: false                # 16a 엔 otel-lgtm 이 없다
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopsaga
  labels: { app: order-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        # ConfigMap 이 바뀌어도 파드는 자동으로 재시작되지 않는다(파일 마운트는 갱신되지만
        # Spring 은 이미 읽은 설정을 다시 바인딩하지 않는다 — Phase 15 의 리프레시가 필요한 이유).
        # 그래서 설정을 바꾸면 `kubectl rollout restart deployment/order-service` 로 명시적으로 굴린다.
        shopsaga.io/config-source: configmap/order-service-config
    spec:
      containers:
        - name: order-service
          image: shopsaga/order-service:0.0.1
          # ★★ 가장 많이 밟는 함정: 태그가 `latest` 면 imagePullPolicy 기본값이 Always 가 되어
          #    로컬(kind)에 이미지가 있어도 레지스트리로 나가서 ImagePullBackOff 로 죽는다.
          #    → 태그를 명시(0.0.1)하고 정책도 명시한다. 그리고 반드시 `kind load docker-image` 로 넣을 것.
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: JAVA_OPTS, value: "-Xms128m -Xmx320m" }
            - { name: SPRING_CONFIG_IMPORT, value: "" }     # Config Server 의존 제거
            # ── Downward API: 파드가 자기 자신에 대한 정보를 환경변수로 받는다 ──
            # 애플리케이션이 k8s API 를 호출하지 않고도 자기 이름을 안다(권한 불필요).
            # 로그·메트릭에 파드 이름을 남기거나, 여기처럼 /actuator/info 로 신원을 확인할 때 쓴다.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # ★ Secret → 환경변수. 환경변수는 ConfigMap 파일보다 우선순위가 높다.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: order-db-credentials, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: order-db-credentials, key: password } }
          volumeMounts:
            - { name: config, mountPath: /application/config, readOnly: true }
          # ⚠️ timeoutSeconds 기본값은 1초다. readiness 는 DB 를 조회하므로(위 group 설정) 1초는 빡빡하다 —
          #    부하가 조금만 올라도 probe 가 타임아웃해 멀쩡한 파드가 Endpoints 에서 빠졌다 들어왔다 한다(flapping).
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36        # 최대 3분 — Flyway 마이그레이션까지 포함해 기다린다
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { memory: 384Mi, cpu: 150m }
            limits:   { memory: 640Mi }
      # Boot 의 graceful shutdown(server.shutdown: graceful)이 진행 중인 요청을 마칠 시간을 준다.
      # k8s 는 SIGTERM 후 이 시간이 지나면 SIGKILL 한다. Dockerfile 이 `exec java` 라서 JVM 이 PID 1 =
      # SIGTERM 을 직접 받는다(exec 없이 sh 로 감싸면 신호가 JVM 에 전달되지 않아 매번 강제 종료된다).
      terminationGracePeriodSeconds: 45
      volumes:
        - name: config
          configMap: { name: order-service-config }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopsaga
spec:
  # NodePort = 모든 노드의 30080 포트를 열고 이 Service 로 넘긴다.
  # kind 노드는 컨테이너이므로 kind-cluster.yaml 의 extraPortMappings 로 밖까지 뚫어 두었다.
  # ⚠️ 학습용이다. 실제로는 16b 처럼 Ingress(또는 LoadBalancer) 를 쓴다 —
  #    NodePort 는 30000~32767 범위 강제, 서비스마다 포트를 외워야 하고, TLS·경로 라우팅이 없다.
  type: NodePort
  selector: { app: order-service }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 30080 }
