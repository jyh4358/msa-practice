# Phase 16b — auth-service (RS256 JWT 발급 + JWKS 공개).
#
# ★ 16a 의 한계 #4 를 여기서 해결한다 — **복제본을 2로 올린다.**
#   16a 까지 auth-service 는 기동할 때마다 RSA 키쌍을 새로 만들었다. 그래서 파드가 둘이면
#   A 가 발급한 토큰을 B 의 JWKS 로는 검증할 수 없어 산발적 401 이 났다.
#   이제 키를 Secret(`auth-jwt-key`)에서 읽으므로 **모든 파드가 같은 키**를 쓴다.
#   (키는 apply.sh 가 openssl 로 만들어 넣는다 — 리포지토리에 커밋하지 않기 위함.)
#
# 설정은 다른 서비스와 동일하게 ConfigMap 두 개를 서브디렉터리로 마운트한다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shopsaga
  labels: { app: auth-service }
spec:
  replicas: 2          # ★ 키를 공유하므로 이제 가능하다(16a 에서는 1이 상한이었다)
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: shopsaga/auth-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 9000 }
          env:
            - { name: JAVA_OPTS, value: "-Xms128m -Xmx256m" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # ★ 서명 키는 ConfigMap 이 아니라 Secret 에서 온다.
            - name: AUTH_JWT_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: auth-jwt-key, key: private-key } }
            - name: AUTH_JWT_KEY_ID
              valueFrom: { secretKeyRef: { name: auth-jwt-key, key: key-id } }
          volumeMounts:
            - { name: common-config,  mountPath: /application/config/10-common,  readOnly: true }
            - { name: service-config, mountPath: /application/config/20-service, readOnly: true }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 9000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9000 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { memory: 320Mi, cpu: 100m }
            limits:   { memory: 512Mi }
      terminationGracePeriodSeconds: 45
      volumes:
        - name: common-config
          configMap: { name: shopsaga-common }
        - name: service-config
          configMap: { name: auth-service-config }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: shopsaga }
spec:
  type: ClusterIP
  selector: { app: auth-service }
  ports:
    - { name: http, port: 9000, targetPort: 9000 }
