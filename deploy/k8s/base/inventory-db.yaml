# Phase 16b — inventory-service 의 Postgres (Phase 9 에서 분리한 재고 소유 서비스).
# 구조·주석은 20-order-db.yaml 참고.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: inventory-db-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  labels: { app: inventory-db }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: inventory-db }
  template:
    metadata:
      labels: { app: inventory-db }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: inventorydb }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: inventory-db-credentials, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-db-credentials, key: password } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "inventory", "-d", "inventorydb"] }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "inventory", "-d", "inventorydb"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: inventory-db-data }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-db }
spec:
  type: ClusterIP
  selector: { app: inventory-db }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
