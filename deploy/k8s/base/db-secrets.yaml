# Phase 16 — Secret: 비밀값을 이미지·ConfigMap 밖으로.
#
# Phase 6 에서는 Config Server 가 `{cipher}...` 암호문을 들고 있다가 응답 직전에 복호화했다.
# Phase 16b 에서 Config Server 를 삭제하면서 그 역할을 **Secret** 이 이어받았다 —
# 설정과 비밀을 분리한다는 목적은 같고, 복호화 키(ENCRYPT_KEY)를 아무도 들고 있을 필요가 없어졌다.
#
# ⚠️⚠️ 정직하게 짚고 갈 것: **Secret 은 암호화가 아니다.**
#   `data:` 는 base64 인코딩일 뿐이고 `kubectl get secret -o yaml | base64 -d` 로 누구나 읽는다.
#   etcd 에도 기본값은 평문 저장이다(암호화하려면 EncryptionConfiguration 을 별도로 켜야 한다).
#   Secret 이 ConfigMap 보다 나은 실질적 이유는 ① RBAC 로 접근을 따로 통제할 수 있고
#   ② `kubectl describe` 나 로그에 값이 찍히지 않으며 ③ 노드에 tmpfs 로 마운트된다는 것 정도다.
#   운영이라면 여기서 멈추지 말고 External Secrets Operator / Vault / SOPS 로 가야 한다.
#
# ⚠️ 그래서 이 파일은 **학습용 dev 값만** 담는다. 운영 비밀번호를 이 파일에 넣고 커밋하지 말 것.
#
# stringData: 를 쓰면 평문으로 적어도 k8s 가 저장 시 base64 로 인코딩해 준다(가독성 ↑, 실수 ↓).
#
# ※ auth-service 의 RSA 서명 키는 여기 없다 — 매번 새로 만들어야 하므로 `deploy/k8s/apply.sh` 가
#   `openssl` 로 생성해 Secret `auth-jwt-key` 로 넣는다(키를 리포지토리에 커밋하지 않기 위함).
---
apiVersion: v1
kind: Secret
metadata: { name: order-db-credentials }
type: Opaque
stringData:
  # compose 와 동일한 dev 계정 — Phase 7~15 와 같은 값이라 볼륨/스키마가 호환된다.
  username: order
  password: orderpw
---
apiVersion: v1
kind: Secret
metadata: { name: payment-db-credentials }
type: Opaque
stringData:
  username: payment
  password: paymentpw
---
apiVersion: v1
kind: Secret
metadata: { name: inventory-db-credentials }
type: Opaque
stringData:
  username: inventory
  password: inventorypw
---
apiVersion: v1
kind: Secret
metadata: { name: order-query-mongo-credentials }
type: Opaque
stringData:
  username: orderquery
  password: orderquerypw
