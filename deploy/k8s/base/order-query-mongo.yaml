# Phase 16b — CQRS 읽기 모델 저장소(Phase 11). 쓰기 DB(orderdb)와 완전히 분리된 문서형 저장소.
#
# ⚠️ Apple Silicon 함정: `mongo:8` 의 amd64 변이를 받아오면 AVX 명령이 없어 mongod 가 안 뜬다
#    (컨테이너는 running 인데 포트가 안 열린다). kind 노드로 넣기 전에 확인:
#      docker image inspect mongo:8 --format '{{.Architecture}}'   → arm64 여야 한다
#      아니면: docker rmi mongo:8 && docker pull --platform linux/arm64 mongo:8
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: order-query-mongo-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-query-mongo
  labels: { app: order-query-mongo }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: order-query-mongo }
  template:
    metadata:
      labels: { app: order-query-mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports: [{ name: mongo, containerPort: 27017 }]
          env:
            # 루트 사용자는 항상 admin DB 에 생성된다 → 클라이언트는 authentication-database=admin 필요.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: order-query-mongo-credentials, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: order-query-mongo-credentials, key: password } }
            - { name: MONGO_INITDB_DATABASE, value: orderquerydb }
          volumeMounts: [{ name: data, mountPath: /data/db }]   # mongo 데이터 경로는 /data/db
          readinessProbe:
            # mongo:6+ 는 레거시 `mongo` 셸이 제거됨 → 반드시 `mongosh`.
            exec: { command: ["sh", "-c", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""] }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits:   { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: order-query-mongo-data }
---
apiVersion: v1
kind: Service
metadata: { name: order-query-mongo }
spec:
  type: ClusterIP
  selector: { app: order-query-mongo }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
