# Phase 16b — order-query-service (CQRS 읽기 모델 — Mongo 투영)
#
# Phase 16a 와 달라진 점: ConfigMap 이 매니페스트 안에 인라인으로 있지 않다.
# `deploy/config/{common,order-query-service}.yml` 로부터 `deploy/k8s/apply.sh` 가 ConfigMap 을 만들어
# 두 개의 서브디렉터리로 마운트한다 — **compose 와 완전히 같은 설정 파일**이다.
#   /application/config/10-common/application.yml   ← 공통(서비스 주소·Kafka·probe·관측성)
#   /application/config/20-service/application.yml  ← 이 서비스 전용(DB 호스트 등)
# Spring Boot 는 `file:./config/*/` 하위를 이름순으로 읽고 뒤쪽이 이긴다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-query-service
  labels: { app: order-query-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-query-service }
  template:
    metadata:
      labels: { app: order-query-service }
    spec:
      # ★★ k8s 에는 compose 의 depends_on 이 없다 — 보통은 그게 옳다(죽고 다시 뜨면 되니까).
      # 그런데 **재시도되지 않는 기동 작업**이 하나 있다: Spring 의 KafkaAdmin 은 @Bean 으로 선언한
      # NewTopic 들을 **기동 시 딱 한 번** 만든다. 브로커가 아직 없으면 조용히 실패하고 다시 시도하지 않는다.
      # 그러면 앱은 멀쩡히 Running·Ready 인데 토픽이 없어서
      #   "Topic order-events not present in metadata after 5000 ms" 로 outbox 발행이 계속 실패한다.
      #   (실제로 이 Phase 에서 겪었다 — 파드는 전부 초록불인데 Saga 가 PENDING 에서 멈췄다.)
      # 그래서 '진짜 순서가 필요한' 이 지점에만 initContainer 를 둔다.
      # initContainer 는 성공할 때까지 반복 실행되고, 끝나야 본 컨테이너가 시작된다.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ['sh', '-c', 'until nc -z kafka 19092; do echo "kafka 대기..."; sleep 3; done']
          resources:
            requests: { memory: 16Mi, cpu: 10m }
            limits:   { memory: 32Mi }
      containers:
        - name: order-query-service
          image: shopsaga/order-query-service:0.0.1
          # ★ 태그가 latest 면 imagePullPolicy 기본값이 Always 가 되어 kind 에 넣어둔 로컬 이미지를 무시한다.
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8083 }
          env:
            - { name: JAVA_OPTS, value: "-Xms128m -Xmx320m" }
            # Downward API — 파드가 자기 이름을 환경변수로 받는다(k8s API 호출·권한 불필요).
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom: { secretKeyRef: { name: order-query-mongo-credentials, key: username } }
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-query-mongo-credentials, key: password } }
          volumeMounts:
            - { name: common-config,  mountPath: /application/config/10-common,  readOnly: true }
            - { name: service-config, mountPath: /application/config/20-service, readOnly: true }
          # ⚠️ timeoutSeconds 기본값은 1초 — readiness 가 DB 를 조회하므로 여유를 준다(flapping 방지).
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits:   { memory: 640Mi }
      # Boot 의 graceful shutdown(server.shutdown: graceful)이 진행 중인 요청을 마칠 시간.
      # Dockerfile 이 `exec java` 라서 JVM 이 PID 1 = SIGTERM 을 직접 받는다.
      terminationGracePeriodSeconds: 45
      volumes:
        - name: common-config
          configMap: { name: shopsaga-common }
        - name: service-config
          configMap: { name: order-query-service-config }
---
apiVersion: v1
kind: Service
metadata: { name: order-query-service }
spec:
  type: ClusterIP
  selector: { app: order-query-service }
  ports:
    - { name: http, port: 8083, targetPort: 8083 }
