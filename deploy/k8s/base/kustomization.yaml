# Phase 18 — base: "어느 환경에서나 참인 것"만 담는다.
#
# Kustomize 의 사고방식은 Helm 과 다르다.
#   Helm  : 빈칸이 뚫린 **템플릿**({{ .Values.x }})을 값으로 채운다 → 원본은 그 자체로 유효한 YAML 이 아니다.
#   Kustomize: **완성된 YAML** 을 그대로 두고 위에 덧칠(patch/transform)한다 → base 만으로도 배포된다.
#
# 그래서 이 디렉터리의 *.yaml 은 Phase 16b 때와 거의 같은 파일이다. 달라진 건
#   ① 파일마다 박혀 있던 `namespace: shopsaga` 34곳을 지우고 아래 `namespace:` 한 줄로 모았다.
#   ② order-service 의 NodePort(디버그용)는 로컬에서만 필요하므로 overlays/local 로 옮겼다.
#
# 적용:
#   kubectl apply -k deploy/k8s/overlays/local   # 내 노트북(kind)
#   kubectl apply -k deploy/k8s/overlays/ci      # CI (GHCR 이미지)
# 렌더 결과만 보고 싶으면:
#   kubectl kustomize deploy/k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── 네임스페이스 변환기 ───────────────────────────────────────────────────────
# 모든 리소스의 metadata.namespace 를 이 값으로 덮어쓴다(없으면 만들어 준다).
# Namespace 오브젝트 자신의 metadata.name 도 같이 맞춰 준다 — 그래서 namespace.yaml 과 어긋날 일이 없다.
namespace: shopsaga

# ── 공통 라벨 ────────────────────────────────────────────────────────────────
# ⚠️ v5 에서 `commonLabels` 는 폐기됐다. 그리고 라벨을 **selector 에까지** 붙이면
#    기존 Deployment 의 `spec.selector` 는 **불변 필드**라 apply 가 거부당한다.
#    그래서 includeSelectors: false — 조회·정리용 라벨만 붙이고 선택자는 건드리지 않는다.
labels:
  - pairs:
      app.kubernetes.io/part-of: shopsaga
    includeSelectors: false

resources:
  - namespace.yaml

  # ★ 설정: deploy/config/ 를 통째로 끌어온다(그 안의 kustomization.yaml 이 ConfigMap 7개를 만든다).
  #   compose 가 바인드 마운트하는 **바로 그 파일들**이다 — 설정이 둘로 갈라지지 않는다.
  #   디렉터리 참조는 '새 루트'로 취급되므로 로드 제한(root-only)에 걸리지 않는다.
  - ../../config

  # 비밀 — DB 자격증명(평문 dev 값)
  - db-secrets.yaml

  # 인프라(상태 있는 것들)
  - order-db.yaml
  - payment-db.yaml
  - inventory-db.yaml
  - order-query-mongo.yaml
  - kafka.yaml
  - otel-lgtm.yaml

  # 애플리케이션
  - auth-service.yaml
  - order-service.yaml
  - payment-service.yaml
  - inventory-service.yaml
  - order-query-service.yaml
  - gateway-service.yaml

  # 바깥에서 들어오는 문
  - ingress.yaml

# ── auth-service 서명 키가 여기 없는 이유 (Phase 19 에서 옮겼다) ──────────────
# Phase 18 에서는 여기에 `secretGenerator` 가 있어서 `.secrets/` 의 파일을 읽었다.
# Phase 19(GitOps)에서 그게 **구조적으로 불가능**해졌다:
#
#   Argo CD 는 **Git 저장소를 클론해서 렌더**한다. 내 노트북의 파일 시스템을 볼 수 없다.
#   그런데 `.secrets/` 는 개인키라서 .gitignore 대상 — 즉 Git 에 없다.
#   → Argo CD 의 repo-server 에서 `kustomize build` 가 영원히 실패한다.
#
# 부트스트랩 스크립트를 대신 돌려 줄 수도 없다(Argo CD 는 임의 스크립트를 실행하지 않는다.
# 그게 GitOps 의 안전성이기도 하다 — 선언만 읽고, 명령은 안 읽는다).
#
# 그래서 서명 키는 **매니페스트 밖의 클러스터 사전 조건**으로 옮겼다:
#   `deploy/k8s/bootstrap-secrets.sh` 가 `kubectl` 로 Secret `auth-jwt-key` 를 만든다.
#   Deployment 는 그 **고정 이름**을 참조한다(아래 auth-service.yaml).
#
# ⚠️ 대가: 해시 접미사가 없으므로 **키를 갈아도 파드가 자동으로 갈리지 않는다.**
#   교체하려면 `kubectl rollout restart deploy/auth-service -n shopsaga` 를 같이 해야 한다.
#   이건 Phase 18 이 얻었던 성질을 하나 되돌린 것이고, 정직하게 한계표에 남긴다.
#   제대로 된 답은 **Sealed Secrets / External Secrets Operator** —
#   암호문을 Git 에 두거나 외부 저장소에서 받아오면 생성기를 다시 쓸 수 있다.
#
# ※ DB 자격증명(db-secrets.yaml)은 평문 dev 값이라 Git 에 있고, 그대로 Argo CD 가 관리한다.
