# Phase 18 — base: "어느 환경에서나 참인 것"만 담는다.
#
# Kustomize 의 사고방식은 Helm 과 다르다.
#   Helm  : 빈칸이 뚫린 **템플릿**({{ .Values.x }})을 값으로 채운다 → 원본은 그 자체로 유효한 YAML 이 아니다.
#   Kustomize: **완성된 YAML** 을 그대로 두고 위에 덧칠(patch/transform)한다 → base 만으로도 배포된다.
#
# 그래서 이 디렉터리의 *.yaml 은 Phase 16b 때와 거의 같은 파일이다. 달라진 건
#   ① 파일마다 박혀 있던 `namespace: shopsaga` 34곳을 지우고 아래 `namespace:` 한 줄로 모았다.
#   ② order-service 의 NodePort(디버그용)는 로컬에서만 필요하므로 overlays/local 로 옮겼다.
#
# 적용:
#   kubectl apply -k deploy/k8s/overlays/local   # 내 노트북(kind)
#   kubectl apply -k deploy/k8s/overlays/ci      # CI (GHCR 이미지)
# 렌더 결과만 보고 싶으면:
#   kubectl kustomize deploy/k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── 네임스페이스 변환기 ───────────────────────────────────────────────────────
# 모든 리소스의 metadata.namespace 를 이 값으로 덮어쓴다(없으면 만들어 준다).
# Namespace 오브젝트 자신의 metadata.name 도 같이 맞춰 준다 — 그래서 namespace.yaml 과 어긋날 일이 없다.
namespace: shopsaga

# ── 공통 라벨 ────────────────────────────────────────────────────────────────
# ⚠️ v5 에서 `commonLabels` 는 폐기됐다. 그리고 라벨을 **selector 에까지** 붙이면
#    기존 Deployment 의 `spec.selector` 는 **불변 필드**라 apply 가 거부당한다.
#    그래서 includeSelectors: false — 조회·정리용 라벨만 붙이고 선택자는 건드리지 않는다.
labels:
  - pairs:
      app.kubernetes.io/part-of: shopsaga
    includeSelectors: false

resources:
  - namespace.yaml

  # ★ 설정: deploy/config/ 를 통째로 끌어온다(그 안의 kustomization.yaml 이 ConfigMap 7개를 만든다).
  #   compose 가 바인드 마운트하는 **바로 그 파일들**이다 — 설정이 둘로 갈라지지 않는다.
  #   디렉터리 참조는 '새 루트'로 취급되므로 로드 제한(root-only)에 걸리지 않는다.
  - ../../config

  # 비밀 — DB 자격증명(평문 dev 값)
  - db-secrets.yaml

  # 인프라(상태 있는 것들)
  - order-db.yaml
  - payment-db.yaml
  - inventory-db.yaml
  - order-query-mongo.yaml
  - kafka.yaml
  - otel-lgtm.yaml

  # 애플리케이션
  - auth-service.yaml
  - order-service.yaml
  - payment-service.yaml
  - inventory-service.yaml
  - order-query-service.yaml
  - gateway-service.yaml

  # 바깥에서 들어오는 문
  - ingress.yaml

# ── auth-service 서명 키 ─────────────────────────────────────────────────────
# 개인키는 **리포지토리에 커밋하지 않는다**. `deploy/k8s/apply.sh` 가 없으면 그 자리에서 만들고,
# 있으면 그대로 둔다(새로 만들면 이미 발급된 토큰이 전부 무효가 된다).
# `.secrets/` 는 .gitignore 대상이라, 부트스트랩 없이 `kubectl kustomize` 하면 여기서 실패한다 —
# 그게 맞다. "비밀 재료가 없으면 배포도 없다"가 명시적으로 드러나는 편이 낫다.
#
# ★ 여기는 해시 접미사를 **켠 채로** 둔다. 키를 갈면 이름이 바뀌고 → auth 파드가 자동으로 갈린다.
#   키 교체는 원래 재시작이 필요한 일이므로 이 동작이 정확히 옳다.
#
# ⚠️ 운영이라면 이 자리는 External Secrets Operator / Vault / SOPS 의 몫이다.
#   지금은 "개인키가 git 에 없다"까지만 지킨다.
secretGenerator:
  - name: auth-jwt-key
    files:
      - private-key=.secrets/auth-jwt-key.pem
      - key-id=.secrets/auth-jwt-key-id.txt
