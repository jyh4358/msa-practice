# Phase 18 — overlays/ci: GitHub Actions 스모크 잡 전용 덧칠.
#
#   kubectl apply -k deploy/k8s/overlays/ci
#
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일이 없앤 것 — Phase 17 CI 의 sed
# ─────────────────────────────────────────────────────────────────────────────
#   for svc in $SERVICES; do
#     sed -i "s|image: shopsaga/${svc}:0.0.1|image: ${IMAGE_BASE}/${svc}:${GITHUB_SHA}|g" \
#            deploy/k8s/*.yaml
#   done
#
# sed 의 문제는 '더럽다'가 아니라 **틀려도 조용하다**는 것이다.
#   · 매니페스트에서 `image:` 를 한 칸 들여쓰거나 태그를 0.0.2 로 올리면 패턴이 안 맞는데
#     sed 는 0건 치환하고 **성공(exit 0)** 으로 끝난다 → CI 는 초록불인데 옛 이미지로 배포된다.
#   · YAML 을 문자열로 다루므로 주석 안의 `image: shopsaga/...` 같은 것도 같이 바꾼다.
# Kustomize 의 images 변환기는 YAML 을 **파싱해서** container/initContainer 의 image 필드만
# 정확히 바꾸고, 이름이 안 맞으면 아무 일도 안 한다(그리고 렌더 결과를 눈으로 검증할 수 있다).
#
# ─────────────────────────────────────────────────────────────────────────────
# newTag 는 CI 가 채운다
# ─────────────────────────────────────────────────────────────────────────────
# 아래 `newTag: latest` 는 **자리 표시가 아니라 안전한 기본값**이다(사람이 손으로 돌려도 동작한다).
# CI 는 커밋 SHA 로 고정한다:
#   kustomize edit set image shopsaga/order-service=ghcr.io/…/order-service:$GITHUB_SHA
# `kustomize edit` 는 이 파일을 파싱해서 고치므로, 필드가 없으면 만들고 형식이 깨지면 실패한다.
#
# ⚠️ `kustomize edit` 는 kubectl 내장 kustomize 에는 없다(kubectl 은 build 만 노출한다).
#    그래서 CI 는 kustomize 바이너리를 따로 설치한다 — 실무에서도 이렇게 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# ── 이미지 출처 교체 ─────────────────────────────────────────────────────────
# name  : base 매니페스트에 적힌 이미지 이름(태그 제외)과 정확히 일치해야 한다.
# newName: 바꿔 넣을 리포지토리. newTag: 바꿔 넣을 태그.
images:
  - name: shopsaga/auth-service
    newName: ghcr.io/jyh4358/msa-practice/auth-service
    newTag: latest
  - name: shopsaga/order-service
    newName: ghcr.io/jyh4358/msa-practice/order-service
    newTag: latest
  - name: shopsaga/payment-service
    newName: ghcr.io/jyh4358/msa-practice/payment-service
    newTag: latest
  - name: shopsaga/inventory-service
    newName: ghcr.io/jyh4358/msa-practice/inventory-service
    newTag: latest
  - name: shopsaga/order-query-service
    newName: ghcr.io/jyh4358/msa-practice/order-query-service
    newTag: latest
  - name: shopsaga/gateway-service
    newName: ghcr.io/jyh4358/msa-practice/gateway-service
    newTag: latest
